# docker-compose.yml
#
# Milestone 9: one-command local spin-up of the whole platform -
# PostgreSQL, an MLflow tracking server, the app image (generator, ETL,
# database, warehouse, mlops), and Airflow (webserver + scheduler) - in
# place of the manual "install Postgres, create a venv, install Airflow
# in a second venv" setup used in Milestones 1-8.
#
# Quick start:
#   cp .env.example .env      # then edit DB_PASSWORD etc.
#   docker compose up -d postgres mlflow
#   docker compose run --rm app python -m generator.generate_experiments
#   docker compose run --rm app python -m mlops.pipeline.run_mlops_pipeline --skip-db
#   docker compose run --rm app python -m database.load_staging
#   docker compose run --rm app python -m warehouse.build_dim_date
#   docker compose run --rm app python -m warehouse.transform_load
#   docker compose run --rm app python -m warehouse.apply_analytics
#   docker compose up -d airflow-init airflow-webserver airflow-scheduler
#
# See docker/README.md for the full walkthrough, including the Airflow
# UI (http://localhost:8080) and MLflow UI (http://localhost:5000).

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_model_insight}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-airflow-db.sh:/docker-entrypoint-initdb.d/init-airflow-db.sh:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ai_model_insight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # Bind-mount the repo so code/config changes are picked up without
      # rebuilding the image, and so generated data (raw_data/,
      # clean_data/, models/, logs/) lands back on the host.
      - .:/app
    # No command: this service is meant to be invoked with
    # `docker compose run --rm app <command>`, not `docker compose up`.

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in your .env file}
      AIRFLOW_VAR_AI_MODEL_INSIGHT_PROJECT_DIR: /opt/airflow/project
      AIRFLOW_VAR_AI_MODEL_INSIGHT_PYTHON_BIN: python3
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_PASSWORD: ${DB_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - .:/opt/airflow/project
      - airflow_home:/opt/airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - .:/opt/airflow/project
      - airflow_home:/opt/airflow
    ports:
      - "8080:8080"
    command: airflow webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - .:/opt/airflow/project
      - airflow_home:/opt/airflow
    command: airflow scheduler

volumes:
  pgdata:
  mlflow_data:
  airflow_home:
