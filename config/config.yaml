generator:
  num_experiments: 5000
  seed: 42
  output_path: "raw_data/experiments_raw.json"
  status_distribution:
    success: 0.85
    failed: 0.08
    killed: 0.03
    running: 0.04

database:
  host: "localhost"
  port: 5432
  dbname: "ai_model_insight"
  user: "postgres"
  # password must come from an environment variable (DB_PASSWORD), never hardcoded here
  staging_schema: "staging"
  warehouse_schema: "warehouse"

etl:
  clean_output_path: "clean_data/experiments_clean.csv"
  missing_value_strategy: "median"  # options: median, drop, flag

spark:
  app_name: "AIModelInsightPlatform"
  master: "local[*]"
  parquet_output_path: "clean_data/parquet/"

warehouse:
  date_range_start: "2020-01-01"
  date_range_end: "2030-12-31"

logging:
  level: "INFO"
  log_file: "logs/pipeline.log"

# Milestone 7: real ML experiments + MLflow experiment tracking.
# MLFLOW_TRACKING_URI can override tracking_uri via environment variable
# (see mlflow/tracking.py) so CI/other machines don't need to edit this file.
mlops:
  # sqlite backend (not the plain file store) - the file store is in
  # MLflow maintenance mode as of MLflow 3.x, so sqlite is the
  # recommended local/no-server option going forward.
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "ai-model-insight-platform"
  mlflow_raw_output_path: "raw_data/mlflow_runs_raw.json"
  configs_dir: "mlops/experiments/configs"
  dataset: "CIFAR10"
  data_dir: "raw_data/torch_datasets"
  researcher: "Abdelrahman"

# Milestone 11: streaming ingestion + drift detection + alerting.
# REDIS_URL can override redis_url via environment variable (same
# pattern as MLFLOW_TRACKING_URI in the mlops section above).
streaming:
  redis_url: "redis://localhost:6379/0"
  stream_name: "prediction_events"
  consumer_group: "monitoring_consumers"
  consumer_batch_size: 100

monitoring:
  # Drift is flagged when the Population Stability Index (PSI) between
  # a recent window and a baseline window exceeds this threshold.
  # 0.1-0.2 is the commonly cited "moderate shift, investigate" band in
  # industry PSI literature; 0.25 is used here to reduce noise from a
  # small monitoring window before treating it as an emitted alert.
  psi_drift_threshold: 0.25
  # 200 events/window keeps PSI's bin-count statistic stable (see
  # monitoring/drift_detection.py's compute_psi docstring for the
  # empirical false-positive-rate testing behind this number) - lower
  # values are usable but noisier, and were observed during development
  # to false-positive above the threshold on non-drifted data.
  min_events_for_drift_check: 200
  # If set (e.g. a Slack incoming webhook URL), monitoring.alerting
  # POSTs alerts there in addition to always logging them. Left unset
  # by default - alerts always still go to the log either way.
  alert_webhook_url_env_var: "ALERT_WEBHOOK_URL"

